# NFPM packages for Debian/RPM
nfpms:
  - file_name_template: '{{ .ConventionalFileName }}'
    id: forge-packages
    homepage: https://github.com/xraph/forge
    description: |-
      Forge is a comprehensive, opinionated backend framework for Go 
      that provides enterprise-grade features for building scalable, 
      distributed applications.
    maintainer: Your Name <your.email@example.com>
    license: MIT
    vendor: Xraph
    bindir: /usr/bin
    section: utils
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/forge/copyright
        file_info:
          mode: 0644
      - src: ./README.md
        dst: /usr/share/doc/forge/README.md
        file_info:
          mode: 0644
    formats:
      - apk
      - deb
      - rpm
      - termux.deb
      - archlinux
    dependencies:
      - git
    recommends:
      - golang
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

# Docker images - Using buildx for cross-platform builds
# Note: dockers API is deprecated in favor of dockers_v2, but v2 syntax is still evolving
# and lacks full feature parity. Keeping dockers/docker_manifests until v2 is production-ready.
dockers:
  - id: forge-amd64
    image_templates:
      - "ghcr.io/xraph/forge:{{ .Version }}-amd64"
      - "ghcr.io/xraph/forge:latest-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--platform=linux/amd64"
  - id: forge-arm64
    image_templates:
      - "ghcr.io/xraph/forge:{{ .Version }}-arm64"
      - "ghcr.io/xraph/forge:latest-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
      - "--platform=linux/arm64"
    goarch: arm64

# Docker manifests for multi-arch images
docker_manifests:
  - name_template: "ghcr.io/xraph/forge:{{ .Version }}"
    image_templates:
      - "ghcr.io/xraph/forge:{{ .Version }}-amd64"
      - "ghcr.io/xraph/forge:{{ .Version }}-arm64"
  - name_template: "ghcr.io/xraph/forge:latest"
    image_templates:
      - "ghcr.io/xraph/forge:latest-amd64"
      - "ghcr.io/xraph/forge:latest-arm64"

# Git settings
git:
  tag_sort: -version:refname

  # This repository tags far more than the CLI: every extension gets its own
  # `extensions/<name>/vX.Y.Z`, and the editor plugin gets `vscode-forge/vX.Y.Z`.
  # Without this, GoReleaser takes the newest tag in the whole repo as "the
  # release", picks up whichever extension was tagged last, and refuses with
  #
  #   git tag extensions/ai/v1.9.3 was not made against commit <sha>
  #
  # because that tag belongs to a different commit than the one being released.
  # Snapshot builds hide it -- tag validation is disabled there -- so it only
  # ever surfaces during a real release. Restricting the search to the CLI's own
  # `vX.Y.Z` tags is what makes a snapshot and a release agree.
  ignore_tags:
    - 'extensions/*'
    - 'vscode-forge/*'

# Metadata
metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'