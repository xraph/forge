# GoReleaser configuration for Forge CLI
# Build system for cross-platform releases
version: 2

project_name: forge


# Pre-build hooks (run in root module context)
before:
  hooks:
    # MUST be first: every hook below, and the build itself, resolves modules.
    #
    # `builds.dir` is ./cmd/forge, which is a separate module pinning the last
    # PUBLISHED github.com/xraph/forge -- its go.mod has to stay free of replace
    # directives for `go install ...@latest` to accept it (see the comment at the
    # top of that file). Without a workspace the build therefore compiles the CLI
    # against the *released* root module rather than this tree, so any root API a
    # tag adds but has not published yet fails as "undefined". That is not
    # hypothetical: it is how the release broke, with `client.DiffSpecs` and
    # `client.PathFilter` undefined against a root module pinned several versions
    # back.
    #
    # This is the same throwaway workspace the "Build CLI" job in go.yml creates,
    # moved to where the *release* can see it -- that job builds the CLI
    # correctly and the release did not, which is the whole reason the two
    # disagreed. go.work is gitignored, so it never escapes the runner.
    #
    # GOWORK is pinned to this directory because a bare `go work init` searches
    # upward and refuses with "go.work already exists" if the checkout happens to
    # sit inside another workspace -- which a git worktree under the main clone
    # does. Pinning it keeps the hook working wherever the tree is checked out.
    - sh -c 'rm -f go.work go.work.sum && GOWORK="$PWD/go.work" go work init . ./cmd/forge ./extensions/database'
    - go mod tidy
    - go mod verify
    - sh -c "cd cmd/forge && go mod tidy"
    - go generate ./...

builds:
  - id: forge
    dir: ./cmd/forge
    main: .
    binary: forge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Ignore 32-bit architectures for modern CLI
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildTime={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

archives:
  - id: forge-archives
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - merge conflict
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: 'New Features'
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: 'Security Updates'
      regexp: '^.*?sec(\(.+\))??!?:.+$'
      order: 1
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 3
    - title: 'Refactoring'
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 4
    - title: 'Documentation Updates'
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 5
    - title: 'Build System'
      regexp: '^.*?build(\(.+\))??!?:.+$'
      order: 6
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: xraph
    name: forge
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Forge Framework {{ .Tag }} ({{ .Date }})
    
    Welcome to this new release of Forge Framework!

  footer: |
    ## Installation
    
    ### Using Go Install
    ```bash
    go install github.com/xraph/forge/cmd/forge@{{ .Tag }}
    ```
    
    ### Download Binary
    Download the appropriate binary for your platform from the assets below.
    
    ### Using Package Managers
    ```bash
    # Homebrew (macOS/Linux)
    brew install xraph/tap/forge
    
    # Scoop (Windows)
    scoop bucket add xraph https://github.com/xraph/scoop-bucket
    scoop install forge
    ```
    
    ## What's Changed
    Full changelog: https://github.com/xraph/forge/compare/{{ .PreviousTag }}...{{ .Tag }}

# Homebrew tap - DEPRECATED but still functional
# Awaiting clear migration path to homebrew_casks with compatible field structure
brews:
  - repository:
      owner: xraph
      name: homebrew-tap
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    directory: Formula
    homepage: https://github.com/xraph/forge
    description: "Comprehensive backend framework for Go with enterprise-grade features"
    license: MIT
    dependencies:
      - name: go
        type: optional
    install: |
      bin.install "forge"
    test: |
      system "#{bin}/forge", "version"

# Scoop manifest
scoops:
  - repository:
      owner: xraph
      name: scoop-bucket
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: https://github.com/xraph/forge
    description: "Comprehensive backend framework for Go with enterprise-grade features"
    license: MIT

