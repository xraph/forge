name: forge_client_grove
description: Grove CRDT sync for forge_client. Owns Grove-backed entities, projects their replica into the entity store, and syncs them over Grove's protocol.
version: 1.0.0-dev
repository: https://github.com/xraph/forge/tree/main/dart-packages/forge_client_grove
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  forge_client:
    path: ../forge_client
  grove_crdt:
    git:
      url: https://github.com/xraph/grove.git
      path: crdt-dart
      ref: c98e352065b354be48796ce8f64b5cca770dbbfd
  http: ^1.6.0
  meta: ^1.19.0
  uuid: ^4.6.0

dev_dependencies:
  fake_async: ^1.3.3
  # The OfflineClient interplay test only. Its tests import
  # `src/offline_client.dart`, which is plain Dart; the package barrel pulls
  # in Flutter.
  forge_client_offline:
    path: ../forge_client_offline
  lints: ^6.1.0
  test: ^1.32.0
