name: forge_client
description: Runtime core for generated Forge Dart clients. Normalized entity store, tag graph, query cache and REST transport.
version: 1.0.0-dev
repository: https://github.com/xraph/forge/tree/main/dart-packages/forge_client
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.6.0
  meta: ^1.19.0
  uuid: ^4.6.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.1.0
  shelf: ^1.4.2
  test: ^1.32.0
  vm_service: ^15.3.0
