name: forge_client_riverpod
description: Riverpod 3 providers for forge_client. Query families yielding AsyncValue, mutation notifiers, and the same frame, focus and reconnect seams as forge_client_flutter.
version: 1.0.0-dev
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  collection: ^1.19.1
  forge_client:
    path: ../forge_client
  forge_client_flutter:
    path: ../forge_client_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
