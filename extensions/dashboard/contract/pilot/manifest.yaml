schemaVersion: 1
contributor:
  name: core-contract
  envelope:
    supports: [v1]
    preferred: v1
  capabilities: [dashboard.read]
  # The pilot opts into the app switcher as "Forge" with priority 0
  # (lowest = highest position in the dropdown). root: true marks this
  # as the platform app: its routes are NOT prefixed with /@<slug>, so
  # /, /health, /metrics, etc. stay bare. Only non-root apps live under
  # the /@<slug>/* namespace.
  app:
    displayName: Forge
    root: true
    icon: forge
    priority: 0
    home: /

queries:
  extensionList:
    intent: extensions.list
    cache: { staleTime: 10s }
  serviceList:
    intent: services.list
    cache: { staleTime: 5s }
  overview:
    intent: overview
    cache: { staleTime: 5s }
  health:
    intent: health
    cache: { staleTime: 5s }
  metricsReport:
    intent: metrics-report
    cache: { staleTime: 10s }
  tracesList:
    intent: traces.list
    cache: { staleTime: 5s }
  auditList:
    intent: audit.list
    cache: { staleTime: 5s }

intents:
  # Slice (c) original
  - { name: extensions.list, kind: query, version: 1, capability: read }
  - { name: services.list,   kind: query, version: 1, capability: read }
  - { name: services.detail, kind: query, version: 1, capability: read }
  - { name: metrics.summary, kind: subscription, version: 1, capability: read, mode: replace }

  # Slice (h) additions
  - { name: overview,        kind: query, version: 1, capability: read }
  - { name: health,          kind: query, version: 1, capability: read }
  - { name: metrics-report,  kind: query, version: 1, capability: read }
  - { name: traces.list,     kind: query, version: 1, capability: read }
  - { name: traces.detail,   kind: query, version: 1, capability: read }

  # Slice (k) audit
  - { name: audit.list, kind: query,        version: 1, capability: read }
  - { name: audit.tail, kind: subscription, version: 1, capability: read, mode: append }

  # App switcher catalog (per-contributor app blocks aggregated server-side).
  - { name: apps.list,  kind: query, version: 1, capability: read }
