# Written by forge observability. The global, otlp and storage blocks match
# grafana/otel-lgtm 0.36.0's own prometheus.yaml; the forge job is added.
global:
  scrape_interval: 15s
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database
    - kafka.cluster.alias
storage:
  tsdb:
    out_of_order_time_window: 10m
scrape_configs:
  - job_name: forge
    metrics_path: /_/metrics
    # OpenMetrics first: it is the text format that carries exemplars.
    scrape_protocols:
      - OpenMetricsText1.0.0
      - OpenMetricsText0.0.1
      - PrometheusText0.0.4
    file_sd_configs:
      - files:
          - /forge/targets/*.json
        refresh_interval: 5s
