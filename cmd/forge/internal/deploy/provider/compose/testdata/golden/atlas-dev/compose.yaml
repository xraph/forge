# Generated by forge deploy.
configs:
    api-overlay:
        file: ./api/forge.overlay.yaml
    gateway-overlay:
        file: ./gateway/forge.overlay.yaml
    worker-overlay:
        file: ./worker/forge.overlay.yaml
name: atlas-local-dev
networks:
    forge: {}
services:
    api:
        build:
            context: ../../..
            dockerfile: deployments/local/dev/api/Dockerfile
        configs:
            - source: api-overlay
              target: /app/config.local.yaml
        depends_on:
            cache:
                condition: service_healthy
            primary:
                condition: service_healthy
            uploads:
                condition: service_healthy
        environment:
            ATLAS_CACHE_DSN: ${ATLAS_CACHE_DSN}
            ATLAS_PRIMARY_DSN: ${ATLAS_PRIMARY_DSN}
            ATLAS_UPLOADS_DSN: ${ATLAS_UPLOADS_DSN}
            FORGE_HTTP_PORT: "8080"
            PORT: "8080"
        healthcheck:
            interval: 3s
            retries: 40
            start_period: 10s
            test:
                - CMD
                - wget
                - -qO-
                - http://127.0.0.1:8080/_/health/ready
            timeout: 3s
        image: ghcr.io/example/atlas-api:latest
        networks:
            - forge
        restart: unless-stopped
    api-migrate:
        command:
            - migrate
            - up
        configs:
            - source: api-overlay
              target: /app/config.local.yaml
        environment:
            ATLAS_CACHE_DSN: ${ATLAS_CACHE_DSN}
            ATLAS_PRIMARY_DSN: ${ATLAS_PRIMARY_DSN}
            ATLAS_UPLOADS_DSN: ${ATLAS_UPLOADS_DSN}
            FORGE_HTTP_PORT: "8080"
            PORT: "8080"
        image: ghcr.io/example/atlas-api:latest
        networks:
            - forge
        profiles:
            - forge-migrate
        restart: "no"
    cache:
        environment:
            REDIS_ARGS: --appendonly yes
        healthcheck:
            interval: 3s
            retries: 40
            start_period: 10s
            test:
                - CMD
                - redis-cli
                - ping
            timeout: 3s
        image: redis/redis-stack-server:7.4.0-v1
        networks:
            - forge
        restart: unless-stopped
        volumes:
            - cache-data:/data
    gateway:
        build:
            context: ../../..
            dockerfile: deployments/local/dev/gateway/Dockerfile
        configs:
            - source: gateway-overlay
              target: /app/config.local.yaml
        environment:
            API_URL: http://api:8080
            FORGE_HTTP_PORT: "8080"
            PORT: "8080"
        healthcheck:
            interval: 3s
            retries: 40
            start_period: 10s
            test:
                - CMD
                - wget
                - -qO-
                - http://127.0.0.1:8080/_/health/ready
            timeout: 3s
        image: ghcr.io/example/atlas-gateway:latest
        networks:
            - forge
        ports:
            - 8080:8080/tcp
        restart: unless-stopped
    primary:
        environment:
            POSTGRES_DB: atlas
            POSTGRES_PASSWORD: ${ATLAS_PRIMARY_PASSWORD}
            POSTGRES_USER: ${ATLAS_PRIMARY_USER}
        healthcheck:
            interval: 3s
            retries: 40
            start_period: 10s
            test:
                - CMD
                - pg_isready
                - -U
                - ${ATLAS_PRIMARY_USER}
                - -d
                - atlas
            timeout: 3s
        image: postgres:16
        networks:
            - forge
        restart: unless-stopped
        volumes:
            - primary-data:/var/lib/postgresql/data
    uploads:
        command:
            - /data
        environment:
            RUSTFS_ACCESS_KEY: ${ATLAS_UPLOADS_USER}
            RUSTFS_CONSOLE_ENABLE: "false"
            RUSTFS_SECRET_KEY: ${ATLAS_UPLOADS_PASSWORD}
        healthcheck:
            interval: 3s
            retries: 40
            start_period: 10s
            test:
                - CMD
                - curl
                - -fsS
                - http://127.0.0.1:9000/health
            timeout: 3s
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        networks:
            - forge
        restart: unless-stopped
        volumes:
            - uploads-data:/data
    uploads-init:
        entrypoint:
            - /bin/sh
            - -ec
            - aws --endpoint-url "$$ENDPOINT" s3api head-bucket --bucket "$$BUCKET" || aws --endpoint-url "$$ENDPOINT" s3api create-bucket --bucket "$$BUCKET"
        environment:
            AWS_ACCESS_KEY_ID: ${ATLAS_UPLOADS_USER}
            AWS_DEFAULT_REGION: us-east-1
            AWS_SECRET_ACCESS_KEY: ${ATLAS_UPLOADS_PASSWORD}
            BUCKET: atlas-uploads
            ENDPOINT: http://uploads:9000
        image: amazon/aws-cli@sha256:ce44b800602264c12298bbf3399055a4cefdb9ed4a098abe564afe26e7071bce
        networks:
            - forge
        profiles:
            - forge-init
        restart: "no"
    worker:
        build:
            context: ../../..
            dockerfile: deployments/local/dev/worker/Dockerfile
        configs:
            - source: worker-overlay
              target: /app/config.local.yaml
        depends_on:
            cache:
                condition: service_healthy
            primary:
                condition: service_healthy
        environment:
            ATLAS_CACHE_DSN: ${ATLAS_CACHE_DSN}
            ATLAS_PRIMARY_DSN: ${ATLAS_PRIMARY_DSN}
            FORGE_HTTP_PORT: "8080"
            PORT: "8080"
        healthcheck:
            interval: 3s
            retries: 40
            start_period: 10s
            test:
                - CMD
                - wget
                - -qO-
                - http://127.0.0.1:8080/_/health/ready
            timeout: 3s
        image: ghcr.io/example/atlas-worker:latest
        networks:
            - forge
        restart: unless-stopped
volumes:
    cache-data: {}
    primary-data: {}
    uploads-data: {}
