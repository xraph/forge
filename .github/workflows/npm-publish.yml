name: Publish NPM Packages

# Publishes the browser runtime packages under packages/client-*.
#
# Replaces an earlier workflow of the same name that lived only on the
# release/v0.0.2 and release/v0.0.3 branches, published frontend/core and
# frontend/react -- paths that no longer exist in this repository -- and failed
# all 12 of its runs without ever publishing anything. That is why every
# @forge-go/* package still 404s on the registry.
#
# Publish order is load-bearing. The reusable workflow runs one job over one
# checkout and walks this list in order, so a package builds against the dist
# of everything listed above it. client-core goes first: everything else
# declares it as a peer and builds against its dist, so publishing an adapter
# before it would ship a package whose peer cannot be resolved.
#
# client-react-devtools goes last, and is the only entry with peers beyond the
# core. It needs client-react and client-devtools built as well as client-core,
# because its `tsc` resolves all three through `file:` links. Move it up the
# list and its build fails on its own public types.
#
# The list lives in the check job's PACKAGES and reaches publish through that
# job's output, so the job that asks npm and the job that publishes always
# walk the same packages.
#
# A tag whose versions are all on npm already is skipped, not failed. The
# check job asks npm for every package first: all present skips publish, none
# present publishes, and a mix fails naming each side. Skipping only the
# present ones would need the reusable workflow to accept a per-package skip,
# which xraph/workflows' npm-publish.yml does not offer; that change belongs
# in a PR there.

on:
  # A real publish happens only here, on a version tag.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  # Rehearsal. Defaults to a dry run so this can be exercised safely; flip the
  # input to publish from a branch when that is genuinely what you want.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true
      version:
        description: 'Version to stamp (without a leading v). Empty keeps each package.json version.'
        type: string
        default: ''

permissions:
  contents: read

# The tag push and the dispatch release.yml starts for the same tag would
# otherwise race each other to the registry. The later one queues, then finds
# every version present and skips.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves the version and whether this is a real publish.
  #
  # This job exists because the expression language has no string-replace: the
  # leading v cannot be stripped from a tag name inline, and the reusable
  # workflow rejects a version carrying one rather than guessing what was meant.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dry-run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Resolve
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
            dry_run=false
          else
            version="${INPUT_VERSION#v}"
            dry_run="${INPUT_DRY_RUN:-true}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

          if [ "$dry_run" = "true" ]; then
            echo "Dry run at version '${version:-<package.json>}'." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publishing version '${version:-<package.json>}'." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Asks npm which package versions it already has.
  check:
    name: Check npm for existing versions
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.check.outputs.packages }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check
        id: check
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ needs.prepare.outputs.dry-run }}
          # client-core first; everything else peer-depends on it. See the
          # note at the top of this file for why client-react-devtools is last.
          PACKAGES: >-
            ["packages/client-core",
             "packages/client-react",
             "packages/client-vue",
             "packages/client-angular",
             "packages/client-devtools",
             "packages/client-react-devtools"]
        run: |
          set -euo pipefail

          packages=$(jq -c . <<< "$PACKAGES")
          if [ "$(jq length <<< "$packages")" -eq 0 ]; then
            echo "::error::PACKAGES is empty."
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

          err=$(mktemp)
          present=()
          missing=()
          while IFS= read -r dir; do
            name=$(jq -r .name "$dir/package.json")
            version="${VERSION:-$(jq -r .version "$dir/package.json")}"
            spec="$name@$version"
            # npm answers a missing version or package with E404. Older npm
            # printed nothing and exited 0 for a missing version instead.
            if out=$(npm view "$spec" version 2>"$err"); then
              if [ -n "$out" ]; then present+=("$spec"); else missing+=("$spec"); fi
            elif grep -q E404 "$err"; then
              missing+=("$spec")
            else
              cat "$err" >&2
              echo "::error::Could not ask npm whether $spec exists."
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$packages")

          skip=false
          if [ "$DRY_RUN" = "true" ]; then
            if [ "${#present[@]}" -gt 0 ]; then
              echo "::notice::Already on npm, a real publish would trip on: ${present[*]}"
            fi
          elif [ "${#missing[@]}" -eq 0 ]; then
            skip=true
            echo "Every package is on npm already (${present[*]}). Nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "${#present[@]}" -gt 0 ]; then
            echo "::error::Some of these versions are on npm and some are not. Already published: ${present[*]}. Not yet published: ${missing[*]}. The reusable workflow cannot publish only the missing ones; publish those by hand, or bump the version."
            exit 1
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: [prepare, check]
    if: needs.check.outputs.skip != 'true'
    uses: xraph/workflows/.github/workflows/npm-publish.yml@v1
    with:
      # The list, and its order, comes from the check job's PACKAGES.
      packages: ${{ needs.check.outputs.packages }}

      version: ${{ needs.prepare.outputs.version }}
      dry-run: ${{ needs.prepare.outputs.dry-run == 'true' }}

      # Node 24 or newer is required, not preferred: npm 10 (Node 20 and 22)
      # fails `npm ci` on these lockfiles with EBADPLATFORM on an aix-only
      # esbuild binary. See .github/workflows/client-packages.yml.
      node-version: '24'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
