name: Client Packages

# CI for the browser runtime packages under packages/client-*.
#
# These had no CI at all: go.yml covers the Go modules, vscode-extension.yml
# covers the extension, and nothing ran the TypeScript packages' tests, their
# typecheck, or the size budgets the design commits them to. An unenforced
# budget is a sentence in a README.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/client-*/**'
      - '.github/workflows/client-packages.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'packages/client-*/**'
      - '.github/workflows/client-packages.yml'

permissions:
  contents: read

env:
  # Must be 24 or newer, and that is load-bearing rather than housekeeping.
  #
  # `npm ci` on npm 10 fails these lockfiles outright:
  #
  #   npm error code EBADPLATFORM
  #   npm error notsup Unsupported platform for @esbuild/aix-ppc64@0.28.1:
  #     wanted {"os":"aix","cpu":"ppc64"} (current: {"os":"linux","cpu":"x64"})
  #
  # vitest nests its own esbuild (0.28.x) under the top-level one (0.25.x), and
  # npm records that nested copy's 26 per-platform packages WITHOUT the
  # `optional` flag its top-level sibling gets. npm 10 then treats an aix-only
  # binary as required on linux; npm 11 skips it correctly.
  #
  # Verified in docker against these exact lockfiles: node 20 (npm 10.8.2) and
  # node 22 (npm 10.9.8) both fail, node 24 (npm 11.17.0) installs all five
  # packages clean. Node 20 is also past end-of-life.
  NODE_VERSION: '24'

jobs:
  # client-core is its own job because everything else depends on its build
  # output, so a failure here should read as "the core is broken" rather than
  # as four adapter failures.
  core:
    name: client-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client-core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `npm ci`, so a transitive release cannot turn CI red without a commit.
      # It also fails loudly when package.json and the lockfile disagree, which
      # is the check that keeps the two in step.
      - run: npm ci

      # Build precedes typecheck deliberately. tsconfig.test.json pulls in
      # fixtures that import from ../dist, so typechecking a tree that has
      # never been built fails with TS2307 on the package's own entry point.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Packs a tarball and imports it from a directory with no link back to
      # this workspace. `tsc` does not add file extensions to relative import
      # specifiers, so a "type": "module" package built by plain `tsc` emits
      # `from './store'` -- which every bundler resolves and Node resolves for
      # nothing. The build config's `moduleResolution: NodeNext` rejects that at
      # compile time; this is the end-to-end check, and it also catches a broken
      # `exports` map or a `files` list that forgot to ship something.
      - run: npm run smoke

      # The budgets are the design's one falsifiable performance claim.
      - run: npm run size

  adapters:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: core
    strategy:
      fail-fast: false
      matrix:
        package:
          - client-react
          - client-vue
          - client-angular
          - client-devtools
          - client-react-devtools
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Each adapter depends on the core through `file:../client-core`, which
      # npm links without building. The link resolves types to
      # ../client-core/dist/index.d.ts, so an unbuilt core makes every adapter
      # fail with TS2307 on '@forge-go/client-core' plus a cascade of
      # property-does-not-exist errors on its own public types.
      - name: Build client-core
        working-directory: packages/client-core
        run: npm ci && npm run build

      # client-react-devtools is the one entry with siblings beyond the core.
      # It resolves '@forge-go/client-devtools' and '@forge-go/client-react'
      # through `file:` links exactly as everything here resolves the core, so
      # both need a dist of their own or its `tsc` fails the same way, on its
      # own public types. Guarded rather than run for everyone: building two
      # extra packages for the other four entries would be a minute each, on
      # every push, for nothing.
      - name: Build sibling packages
        if: matrix.package == 'client-react-devtools'
        run: |
          for sibling in client-devtools client-react; do
            (cd "packages/$sibling" && npm ci && npm run build)
          done

      - name: Install
        working-directory: packages/${{ matrix.package }}
        run: npm ci

      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: npm run build

      - name: Typecheck
        working-directory: packages/${{ matrix.package }}
        run: npm run typecheck

      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: npm test

      # `npm version` -- what the release workflow runs -- rewrites the version
      # field and nothing else, so a hand-written peer range on a sibling
      # package drifts the moment a release stamps a version it does not admit.
      # That is how `@forge-go/client-core@^0.1.0` survived into the 1.9.x line
      # and made every published adapter print an unmet peer warning. `prepack`
      # now derives the range at pack time; this asserts the committed tree
      # agrees, so the drift is visible in review rather than on the registry.
      - name: Peer ranges
        working-directory: packages/${{ matrix.package }}
        run: npm run sync-peers -- --check

      # See the same step in the core job. client-react-devtools has no `smoke`
      # script and running it unconditionally would fail the whole entry on a
      # missing script rather than on anything real: it ships a React component
      # and a hook, so a bare `node --input-type=module -e "import(...)"` has
      # nothing to import that does not need a renderer. Its `exports` map is
      # covered instead by its own zero-cost suite, which resolves the
      # `development` and `default` conditions through esbuild and reads the
      # bytes each one produces.
      - name: Smoke (Node ESM)
        if: matrix.package != 'client-react-devtools'
        working-directory: packages/${{ matrix.package }}
        run: npm run smoke

      - name: Size
        working-directory: packages/${{ matrix.package }}
        run: npm run size
