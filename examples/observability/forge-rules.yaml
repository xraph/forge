# Prometheus rules for forge services, written by `forge observability export`.
# Availability objective: 99.9%. The burn rate alerts follow the
# multiwindow, multi-burn-rate pattern from the Google SRE workbook.
groups:
  - name: forge-http-recording
    rules:
      - record: job:http_server_requests:rate5m
        expr: sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
      - record: job_route:http_server_requests:rate5m
        expr: sum by (job, http_route) (rate(http_server_request_duration_seconds_count[5m]))
      - record: job:http_server_request_errors:ratio_rate5m
        expr: >-
          sum by (job) (rate(http_server_request_duration_seconds_count{error_type!=""}[5m]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
      - record: job:http_server_request_errors:ratio_rate30m
        expr: >-
          sum by (job) (rate(http_server_request_duration_seconds_count{error_type!=""}[30m]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[30m]))
      - record: job:http_server_request_errors:ratio_rate1h
        expr: >-
          sum by (job) (rate(http_server_request_duration_seconds_count{error_type!=""}[1h]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[1h]))
      - record: job:http_server_request_errors:ratio_rate6h
        expr: >-
          sum by (job) (rate(http_server_request_duration_seconds_count{error_type!=""}[6h]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[6h]))
      - record: job_route:http_server_request_duration_seconds:p95_5m
        expr: >-
          histogram_quantile(0.95,
          sum by (job, http_route, le) (rate(http_server_request_duration_seconds_bucket[5m])))
  - name: forge-http-alerts
    rules:
      - alert: ForgeHighErrorBurnFast
        expr: >-
          job:http_server_request_errors:ratio_rate1h > 0.0144
          and job:http_server_request_errors:ratio_rate5m > 0.0144
        for: 2m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} is burning its error budget fast'
          description: >-
            The error ratio has been above 0.0144 over the last hour and the last five
            minutes, 14.4 times the budget of a 99.9% objective.
      - alert: ForgeHighErrorBurnSlow
        expr: >-
          job:http_server_request_errors:ratio_rate6h > 0.006
          and job:http_server_request_errors:ratio_rate30m > 0.006
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} is burning its error budget'
          description: >-
            The error ratio has been above 0.006 over the last six hours and the last
            thirty minutes, 6 times the budget of a 99.9% objective.
      - alert: ForgeHighLatencyP95
        expr: job_route:http_server_request_duration_seconds:p95_5m > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} {{ $labels.http_route }} p95 is above 1s'
          description: The 95th percentile latency of this route has been above 1s for ten minutes.
